version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # The documentation site.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "site"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "satteri*"
    ignore:
      # @astrojs/check peer-requires typescript ^5 || ^6, so TS 7 fails npm ci.
      # Drop this once it widens the range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
