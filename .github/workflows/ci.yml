name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Cross-compile every release target
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/revision
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/revision
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/revision
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/revision

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      # install.sh is what replaces the binary on a user's machine, so it is held
      # to the same standard as the Go it is shipped with. shellcheck ships with
      # the runner image.
      - name: Shellcheck
        run: shellcheck install.sh

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      # Node 22, not 20: Starlight 0.41 needs Astro 7, which requires >= 22.12.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The website's keybindings reference is generated from internal/tui/keymap.
      # A stale committed table would build green and ship wrong, so fail on any drift.
      - name: Keybindings drift gate
        run: |
          go run ./cmd/keymapdump > "$RUNNER_TEMP/keybindings.json"
          diff -u site/src/data/keybindings.json "$RUNNER_TEMP/keybindings.json"

      - name: Install
        working-directory: site
        run: npm ci
      - name: Check types
        working-directory: site
        run: npm run check
      - name: Check design tokens
        working-directory: site
        run: npm run check:tokens
      - name: Build
        working-directory: site
        run: npm run build

      # Links in the build are absolute under /revision, so lychee needs a root
      # whose layout matches the deployed one.
      - name: Stage the build under its base path
        run: |
          mkdir -p "$RUNNER_TEMP/site/revision"
          cp -R site/dist/. "$RUNNER_TEMP/site/revision/"

      # The first --remap resolves the README's documentation links against this
      # build rather than the deployed site, so a new page's link is checkable
      # before it ships. The second does the same for links to files in this
      # repository: checked against the tree, a file added by the same pull
      # request resolves, where blob/main only would once the branch had merged.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --root-dir ${{ runner.temp }}/site
            --remap 'https://bapatchirag\.github\.io/revision/(.*) file://${{ runner.temp }}/site/revision/$1'
            --remap 'https://github\.com/bapatchirag/revision/blob/main/(.*) file://${{ github.workspace }}/$1'
            --index-files index.html
            --fallback-extensions html
            --include-fragments
            --max-retries 3
            --accept '200..=204,429'
            --no-progress
            README.md
            '${{ runner.temp }}/site/revision/**/*.html'
